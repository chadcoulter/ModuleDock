<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">ModuleDock architecture</title>
  <desc id="desc">The host application shares contract assemblies and ModuleDock.Abstractions with plugins. Each plugin loads into its own AssemblyLoadContext with private dependencies isolated by AssemblyDependencyResolver.</desc>
  <rect width="960" height="560" fill="#0b1f3a"/>
  <text x="48" y="48" fill="#e8f1fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700">ModuleDock architecture</text>
  <text x="48" y="78" fill="#9db4cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Startup composition for .NET 10 Generic Host applications</text>

  <rect x="48" y="110" width="864" height="150" rx="16" fill="#132a4a" stroke="#3db9f0" stroke-width="2"/>
  <text x="72" y="142" fill="#3db9f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Host process</text>
  <rect x="72" y="160" width="240" height="72" rx="10" fill="#1c3c63"/>
  <text x="88" y="190" fill="#e8f1fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Generic Host</text>
  <text x="88" y="210" fill="#9db4cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">IServiceCollection before Build()</text>
  <rect x="332" y="160" width="240" height="72" rx="10" fill="#1c3c63"/>
  <text x="348" y="190" fill="#e8f1fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">Default load context</text>
  <text x="348" y="210" fill="#9db4cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Contracts + ModuleDock.Abstractions</text>
  <rect x="592" y="160" width="292" height="72" rx="10" fill="#1c3c63"/>
  <text x="608" y="190" fill="#e8f1fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">IPluginCatalog</text>
  <text x="608" y="210" fill="#9db4cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Immutable after startup</text>

  <rect x="48" y="290" width="420" height="220" rx="16" fill="#132a4a" stroke="#2ec4b6" stroke-width="2"/>
  <text x="72" y="322" fill="#2ec4b6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Plugin ALC: marine-rating</text>
  <text x="72" y="350" fill="#e8f1fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">MarineRating.Plugin.dll</text>
  <text x="72" y="372" fill="#9db4cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">plugin.json + .deps.json</text>
  <text x="72" y="394" fill="#9db4cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Private dependencies via AssemblyDependencyResolver</text>
  <text x="72" y="430" fill="#f4a261" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Shared: host contracts, Microsoft.Extensions.*</text>
  <text x="72" y="452" fill="#9db4cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Not shared: plugin-private libraries</text>

  <rect x="492" y="290" width="420" height="220" rx="16" fill="#132a4a" stroke="#f4a261" stroke-width="2"/>
  <text x="516" y="322" fill="#f4a261" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Plugin ALC: aviation-rating</text>
  <text x="516" y="350" fill="#e8f1fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">AviationRating.Plugin.dll</text>
  <text x="516" y="372" fill="#9db4cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Own AssemblyLoadContext</text>
  <text x="516" y="394" fill="#9db4cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">May use a different private dependency version</text>
  <text x="516" y="430" fill="#2ec4b6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Same IRiskCalculator type identity as the host</text>
  <text x="516" y="452" fill="#9db4cc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">ALC is not a sandbox or process boundary</text>
</svg>
